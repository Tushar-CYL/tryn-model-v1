# Phase 2 (proper) — captioning with a PRETRAINED LM decoder + LoRA.
# Frozen SigLIP + trained connector + pretrained SmolLM2 (LoRA). Fits a free T4.
defaults:
  - base
  - _self_

experiment: caption_lm

device: auto

image:
  image_size: 224

encoder:
  type: siglip
  model_name: google/siglip-base-patch16-224
  freeze: true

connector:
  type: resampler
  num_latents: 64        # vision-token budget prepended to the LM (more = more detail)
  n_heads: 8
  depth: 3

lm:
  model_name: HuggingFaceTB/SmolLM2-360M   # 360M gives noticeably better captions than 135M
  freeze_base: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj]

data:
  shards_dir: data/processed/coco_train
  batch_size: 16
  max_len: 48

optim:
  lr: 2.0e-4             # LoRA learning rate
  connector_lr: 1.0e-3  # connector trains faster than the LoRA adapters
  connector_warmup: 400 # Stage-2: train connector alone, then enable LoRA (Stage-3)
  steps: 6000
  weight_decay: 0.01
  warmup: 200           # linear LR warmup, then cosine decay
  grad_clip: 1.0
  accum_steps: 2        # effective batch = batch_size * accum_steps
  amp: fp16             # "fp16" (T4) | "bf16" (Ampere+) | "none"

eval:
  every: 500
  n_samples: 6

checkpoint:
  dir: outputs/caption_lm
  resume: null          # path to last.pt to resume (model + optimizer + step)

tracking:
  backend: wandb
  mode: disabled
  run_name: caption-lm
